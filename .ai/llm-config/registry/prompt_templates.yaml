version: 1

templates:
  - prompt_template_id: literature-key-content-section
    version: 2
    runtime_profile_id: literature_key_content_v2
    description: Extract source-grounded key-content items from one fulltext section.
    variables_schema:
      type: object
      required: [title, source_refs, section_text]
      properties:
        title:
          type: string
        source_refs:
          type: array
        section_text:
          type: string
    notes:
      - Output only exact ref_type and bare ref_id values from provided source_refs.
      - Do not cite bibliography prose, labels, or concatenated source-ref descriptions.

  - prompt_template_id: literature-key-content-consolidation
    version: 2
    runtime_profile_id: literature_key_content_v2
    description: Consolidate section-level key-content items into a paper-level dossier.
    variables_schema:
      type: object
      required: [title, source_refs, categories]
      properties:
        title:
          type: string
        source_refs:
          type: array
        categories:
          type: object
    notes:
      - Preserve source_refs already present on section-level items.
      - Do not invent source refs during consolidation.

  - prompt_template_id: literature-auto-pull-quality
    version: 1
    runtime_profile_id: auto_pull_quality.v1
    description: Score a candidate paper for literature intake quality.
    variables_schema:
      type: object
      required: [title, provider, ranking_signals]
      properties:
        title:
          type: string
        provider:
          type: string
        ranking_signals:
          type: object
    notes:
      - Return a single quality_score number from 0 to 100.

  - prompt_template_id: topic-selection-research-slice-planning
    version: 1
    runtime_profile_id: topic_selection_research_slice_planning.v1
    description: Generate source-grounded, constraint-bounded ResearchSlice options for v1b topic selection.
    variables_schema:
      type: object
      required: [planning_input_json]
      properties:
        planning_input_json:
          type: object
    notes:
      - Return only JSON matching the ResearchSlice option-set schema.
      - Do not introduce unmet needs beyond the provided ValidatedNeed and evidence refs.
      - Every option must cite copied refs from the supplied planning input.
      - Every option must include claim_ceiling_alignment; exceeds is not selectable and uncertain requires review.

  - prompt_template_id: topic-selection-topic-question-formation
    version: 1
    runtime_profile_id: topic_selection_topic_question_formation.v1
    description: Generate source-grounded, answerability-checked TopicQuestion candidates for v1b topic selection.
    variables_schema:
      type: object
      required: [topic_question_formation_input_json]
      properties:
        topic_question_formation_input_json:
          type: object
    notes:
      - Return only JSON matching the TopicQuestion candidate-set schema.
      - Copy ValidatedNeed, ResearchSlice boundary, assumption, and evidence refs from the supplied v1b handoff.
      - Do not introduce new unmet-need proof, new evidence authority, value assessment, package, promotion, or PaperProject objects.
      - Each admissible candidate must include an answerability plan, claim ceiling fit, excluded claims, allowed refinements, and falsification conditions.

  - prompt_template_id: topic-selection-topic-value-assessment
    version: 1
    runtime_profile_id: topic_selection_topic_value_assessment.v1
    description: Assess v1b TopicQuestion value from the active question contract and selected ResearchSlice snapshot.
    variables_schema:
      type: object
      required: [topic_value_assessment_input_json, research_slice_snapshot_json]
      properties:
        topic_value_assessment_input_json:
          type: object
        research_slice_snapshot_json:
          type: object
    notes:
      - Return only JSON matching the TopicValueAssessment structured reasoning schema.
      - Cite only refs inherited from the T-059 value handoff and T-057 ResearchSlice snapshot.
      - Do not prove a new unmet need, create new evidence authority, rewrite the question, or expand the slice.
      - Do not create a TopicPackage, promotion decision, PaperProject, or package-readiness claim.
      - advance_to_package only means the draft-package handoff may be prepared by deterministic service logic.

  - prompt_template_id: topic-selection-promotion-decision-support
    version: 1
    runtime_profile_id: topic_selection_promotion_decision_support.v1
    description: Draft reviewer-facing support prose for v1c promotion review from a frozen PromotionInputSnapshotHandoff.
    variables_schema:
      type: object
      required: [promotion_input_handoff_json]
      properties:
        promotion_input_handoff_json:
          type: object
    notes:
      - Return only JSON with summary, reviewer_questions, risk_notes, recheck_notes, and dossier_markdown.
      - Do not output or override a promotion gate disposition.
      - Do not authorize promotion, create human decisions, create PaperProject bridges, or modify v1b/T-061 authority objects.
      - Copy refs only from the supplied PromotionInputSnapshotHandoff.

  - prompt_template_id: topic-selection-v1c-promotion-support-bounded-micro-debate
    version: 1
    runtime_profile_id: topic-selection.v1c.promotion-support.bounded-micro-debate.codex.v1
    description: Run one fixed-role Codex call within the v1c N2 bounded micro-debate acceptance workflow.
    variables_schema:
      type: object
      required: [role_slot, context_packet_json, prior_role_outputs_json]
      properties:
        role_slot:
          type: string
        context_packet_json:
          type: object
        prior_role_outputs_json:
          type: object
    notes:
      - Return only JSON for the requested role slot.
      - Do not output gate disposition, promotion decision, bridge authorization, or downstream mutation fields.
      - Copy refs only from the provided N1-derived context packet.
      - The synthesizer.final output must include N3-readable semantic slots and critic-finding resolution coverage.

  - prompt_template_id: topic-selection-v1c-gate-diagnostic-adjunct
    version: 1
    runtime_profile_id: topic-selection.v1c.gate-diagnostic-adjunct.codex.v1
    description: Produce Codex diagnostic guidance after a deterministic N3 action_required gate without changing routing authority.
    variables_schema:
      type: object
      required: [gate_result_json, allowed_refs_json]
      properties:
        gate_result_json:
          type: object
        allowed_refs_json:
          type: array
    notes:
      - Return only diagnostic JSON.
      - Do not change or restate a new routing outcome.
      - Any repair suggestions must point to existing required_actions or allowed refs.

  - prompt_template_id: topic-selection-v1c-codex-delegated-promotion-decision
    version: 1
    runtime_profile_id: topic-selection.v1c.codex-delegated-promotion-decision.codex.v1
    description: Produce a structured N4 delegated promotion decision candidate under an explicit authorization envelope.
    variables_schema:
      type: object
      required: [delegation_envelope_json, gate_handoff_json]
      properties:
        delegation_envelope_json:
          type: object
        gate_handoff_json:
          type: object
    notes:
      - Return only the delegated decision candidate JSON.
      - The candidate is not authority until deterministic N4 admission passes.
      - Do not create PaperProjectBridge or downstream intake fields.
      - Copy refs and hashes exactly from the supplied gate handoff and authorization envelope.

  - prompt_template_id: topic-selection-v1c-downstream-feedback-normalization
    version: 1
    runtime_profile_id: topic-selection.v1c.downstream-feedback-normalization.codex.v1
    description: Normalize semi-structured downstream feedback into the v1c N6 structured feedback candidate contract.
    variables_schema:
      type: object
      required: [bridge_context_json, raw_feedback_text]
      properties:
        bridge_context_json:
          type: object
        raw_feedback_text:
          type: string
    notes:
      - Return only the structured feedback candidate JSON.
      - Do not invent refs, mutate bridge or promotion records, or create recheck artifacts directly.
      - Recheck-producing feedback must include a non-empty required_action.

  - prompt_template_id: paper-implementation-trace-integrity-boundary-debate
    version: 1
    runtime_profile_id: paper-implementation.trace-integrity.boundary-debate.v1
    description: Run one fixed role in the PaperImplementation trace-integrity boundary debate runtime slot.
    variables_schema:
      type: object
      required: [role_slot_id, retrieval_packet_ref, retrieval_packet_hash, reviewed_statement_refs, source_refs]
      properties:
        role_slot_id:
          type: string
        retrieval_packet_ref:
          type: object
        retrieval_packet_hash:
          type: string
        reviewed_statement_refs:
          type: array
        source_refs:
          type: array
        prior_role_artifact_refs:
          type: array
    notes:
      - Return only the TraceIntegrityRoleArtifact JSON for the requested role slot.
      - Cite only refs present in the bounded retrieval packet or prior admitted role artifacts.
      - Do not write trace repairs, claims, dossier readiness, work orders, queue items, prompt text, or raw provider output.
      - Semantic blockers must use the trace-integrity blocker taxonomy documented in T-114.

  - prompt_template_id: paper-implementation-claim-boundary-debate
    version: 1
    runtime_profile_id: paper-implementation.claim-boundary.boundary-debate.v1
    description: Run one fixed role in the PaperImplementation claim-boundary debate runtime slot.
    variables_schema:
      type: object
      required: [slot_id, role_slot_id, target_ref, source_refs, source_hash_bundle_hash]
      properties:
        slot_id:
          type: string
        role_slot_id:
          type: string
        target_ref:
          type: object
        source_refs:
          type: array
        source_hash_bundle_hash:
          type: string
        prior_role_artifact_refs:
          type: array
    notes:
      - Return only the PaperImplementationP1RuntimeReviewRoleArtifact JSON for the requested role slot.
      - Final adjudicator output may include a domain_gate_request for CreateClaimCandidateRequest only.
      - Do not create claims, trace packets, dossiers, queue items, prompt text, or raw provider output directly.
      - Preserve forbidden_overclaims, support/challenge refs, claim trace refs, and failed-run accounting.

  - prompt_template_id: paper-implementation-dossier-readiness-audit
    version: 1
    runtime_profile_id: paper-implementation.dossier-readiness.readiness-audit.v1
    description: Run one fixed role in the PaperImplementation dossier-readiness audit runtime slot.
    variables_schema:
      type: object
      required: [slot_id, role_slot_id, target_ref, source_refs, source_hash_bundle_hash]
      properties:
        slot_id:
          type: string
        role_slot_id:
          type: string
        target_ref:
          type: object
        source_refs:
          type: array
        source_hash_bundle_hash:
          type: string
        prior_role_artifact_refs:
          type: array
    notes:
      - Return only the PaperImplementationP1RuntimeReviewRoleArtifact JSON for the requested role slot.
      - Final adjudicator output may include a domain_gate_request for CreateImplementationDossierRequest only.
      - Do not create dossiers, writing packets, claims, queue items, prompt text, or raw provider output directly.
      - Preserve claim trace refs, failed/inconclusive run refs, readiness blockers, and scenario alternatives.

  - prompt_template_id: paper-implementation-result-analysis-scenarios
    version: 1
    runtime_profile_id: paper-implementation.result-analysis.interpretation-scenarios.v1
    description: Run the fixed PaperImplementation result-analysis interpretation-scenario runtime role.
    variables_schema:
      type: object
      required: [slot_id, role_slot_id, target_ref, source_refs, source_hash_bundle_hash]
      properties:
        slot_id:
          type: string
        role_slot_id:
          type: string
        target_ref:
          type: object
        source_refs:
          type: array
        source_hash_bundle_hash:
          type: string
        required_scenario_kinds:
          type: array
    notes:
      - Return only the PaperImplementationResultAnalysisRoleArtifact JSON for the interpretation-scenario role.
      - Passed output must include scenario_outputs and a domain_gate_request for CreateResultInterpretationPacketRequest only.
      - Interpretations are not evidence; keep run evidence, validation reports, failed runs, limitations, and follow-up refs separate.
      - Do not create result packets, claims, dossiers, writing packets, queue items, prompt text, or raw provider output directly.

  - prompt_template_id: paper-implementation-experiment-design-work-order-draft
    version: 1
    runtime_profile_id: paper-implementation.experiment-design.work-order-draft.v1
    description: Run the fixed PaperImplementation experiment-design WorkOrder draft proposal runtime role.
    variables_schema:
      type: object
      required: [slot_id, role_slot_id, target_ref, source_refs, source_hash_bundle_hash]
      properties:
        slot_id:
          type: string
        role_slot_id:
          type: string
        target_ref:
          type: object
        source_refs:
          type: array
        source_hash_bundle_hash:
          type: string
    notes:
      - Return only the PaperImplementationExperimentPlanningRoleArtifact JSON for the WorkOrder designer role.
      - Passed output must include at least two work_order_draft_candidates with explicit confirmatory/exploratory separation.
      - Candidates may contain WorkOrder draft request payloads but must not create or admit WorkOrders directly.
      - Do not submit live experiments, create queue items, prompt text, or raw provider output.

  - prompt_template_id: paper-implementation-experiment-critique-plan-critique
    version: 1
    runtime_profile_id: paper-implementation.experiment-critique.plan-critique.v1
    description: Run the fixed PaperImplementation independent experiment-plan critique runtime role.
    variables_schema:
      type: object
      required: [slot_id, role_slot_id, target_ref, source_refs, source_hash_bundle_hash, required_critique_dimensions]
      properties:
        slot_id:
          type: string
        role_slot_id:
          type: string
        target_ref:
          type: object
        source_refs:
          type: array
        source_hash_bundle_hash:
          type: string
        required_critique_dimensions:
          type: array
    notes:
      - Return only the PaperImplementationExperimentPlanningRoleArtifact JSON for the independent critic role.
      - Passed output must cover all required critique dimensions and include critique_decision.no_execution_side_effect=true.
      - The critique can block or require revision but must not create WorkOrders, experiment runs, or adapter payloads directly.
      - Do not create queue items, prompt text, or raw provider output.
