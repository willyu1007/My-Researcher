        run_manifest_hash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        workflow_simulation_status:
          type: string
          enum: [not_started, in_progress, workflow_simulation_passed, workflow_simulation_failed, workflow_simulation_blocked]
        required_cell_count: { type: integer, format: int32, minimum: 1, maximum: 2147483647 }
        terminal_cell_count: { type: integer, format: int32, minimum: 0, maximum: 2147483647 }
        collected_cell_count: { type: integer, format: int32, minimum: 0, maximum: 2147483647 }
