      additionalProperties: false
      required: [execution_attempt]
      properties:
        execution_attempt:
          $ref: '#/components/schemas/ExperimentFoundationExecutionAttemptV2'

    ExperimentFoundationWorkflowSimulationV2CellStatus:
      type: object
