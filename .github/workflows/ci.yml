name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-lint:
    name: Governance Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Run governance lint
        run: node .ai/scripts/ctl-project-governance.mjs lint --strict

  backend-checks:
    name: Backend Checks
    runs-on: ubuntu-latest
    # Full backend suite runs ~206 test files serially on the 2-core runner
    # (node --test concurrency = cores-1); 20 min was not enough (run 29679363684)
    timeout-minutes: 40
    services:
      postgres:
        # pgvector required: migrations run CREATE EXTENSION vector (20260605104000+)
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # pnpm must be on PATH before setup-node resolves cache "pnpm"; action-setup
      # reads the pinned version from package.json packageManager and does not
      # depend on the runner's system Node bundling corepack (removed in Node 25+)
      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Shared typecheck
        run: pnpm --filter @paper-engineering-assistant/shared typecheck

      - name: Backend typecheck
        run: pnpm --filter @paper-engineering-assistant/backend typecheck

      - name: LLM runtime configuration check
        run: pnpm llm:config:check

      - name: Backend tests with isolated Prisma schema
        run: pnpm ci:prisma-smoke
        env:
          PRISMA_SMOKE_BASE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          # Default local data root is a macOS volume path that does not exist
          # on Linux runners; literature flow stages that persist artifacts
          # would fail with PARTIAL runs without a writable root
          PAPER_ENGINEER_LOCAL_DATA_ROOT: ${{ runner.temp }}/paper-engineer-data
          # Type checking is already covered by the dedicated tsc --noEmit step
          # above; per-test-process ts-node type checking makes the serial
          # 2-core run blow past any reasonable job timeout
          TS_NODE_TRANSPILE_ONLY: '1'

      - name: Upload backend Prisma test artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: artifacts-backend-prisma-smoke
          path: artifacts/prisma-smoke

  prisma-drift:
    name: Prisma Migrate Drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # pgvector required: migrations run CREATE EXTENSION vector (20260605104000+)
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # pnpm must be on PATH before setup-node resolves cache "pnpm"; action-setup
      # reads the pinned version from package.json packageManager and does not
      # depend on the runner's system Node bundling corepack (removed in Node 25+)
      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # Replays prisma/migrations onto the disposable service DB and diffs the
      # result against schema.prisma; any non-empty migration fails the job.
      # Rules for migration authors: prisma/migrations/AGENTS.md
      - name: Prisma migrate drift check
        run: pnpm ci:prisma-drift
        env:
          PRISMA_DRIFT_SHADOW_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

      - name: Upload drift artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: artifacts-prisma-drift
          path: artifacts/prisma-drift

  desktop-checks:
    name: Desktop Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # pnpm must be on PATH before setup-node resolves cache "pnpm"; action-setup
      # reads the pinned version from package.json packageManager and does not
      # depend on the runner's system Node bundling corepack (removed in Node 25+)
      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Desktop typecheck
        run: pnpm desktop:typecheck

      - name: Desktop renderer build
        run: pnpm --filter @paper-engineering-assistant/desktop build:renderer
