version: 1

templates:
  - prompt_template_id: literature-key-content-section
    version: 2
    runtime_profile_id: literature_key_content_v2
    description: Extract source-grounded key-content items from one fulltext section.
    variables_schema:
      type: object
      required: [title, source_refs, section_text]
      properties:
        title:
          type: string
        source_refs:
          type: array
        section_text:
          type: string
    notes:
      - Output only exact ref_type and bare ref_id values from provided source_refs.
      - Do not cite bibliography prose, labels, or concatenated source-ref descriptions.

  - prompt_template_id: literature-key-content-consolidation
    version: 2
    runtime_profile_id: literature_key_content_v2
    description: Consolidate section-level key-content items into a paper-level dossier.
    variables_schema:
      type: object
      required: [title, source_refs, categories]
      properties:
        title:
          type: string
        source_refs:
          type: array
        categories:
          type: object
    notes:
      - Preserve source_refs already present on section-level items.
      - Do not invent source refs during consolidation.

  - prompt_template_id: literature-auto-pull-quality
    version: 1
    runtime_profile_id: auto_pull_quality.v1
    description: Score a candidate paper for literature intake quality.
    variables_schema:
      type: object
      required: [title, provider, ranking_signals]
      properties:
        title:
          type: string
        provider:
          type: string
        ranking_signals:
          type: object
    notes:
      - Return a single quality_score number from 0 to 100.

  - prompt_template_id: topic-selection-research-slice-planning
    version: 1
    runtime_profile_id: topic_selection_research_slice_planning.v1
    description: Generate source-grounded, constraint-bounded ResearchSlice options for v1b topic selection.
    variables_schema:
      type: object
      required: [planning_input_json]
      properties:
        planning_input_json:
          type: object
    notes:
      - Return only JSON matching the ResearchSlice option-set schema.
      - Do not introduce unmet needs beyond the provided ValidatedNeed and evidence refs.
      - Every option must cite copied refs from the supplied planning input.
      - Every option must include claim_ceiling_alignment; exceeds is not selectable and uncertain requires review.

  - prompt_template_id: topic-selection-topic-question-formation
    version: 1
    runtime_profile_id: topic_selection_topic_question_formation.v1
    description: Generate source-grounded, answerability-checked TopicQuestion candidates for v1b topic selection.
    variables_schema:
      type: object
      required: [topic_question_formation_input_json]
      properties:
        topic_question_formation_input_json:
          type: object
    notes:
      - Return only JSON matching the TopicQuestion candidate-set schema.
      - Copy ValidatedNeed, ResearchSlice boundary, assumption, and evidence refs from the supplied v1b handoff.
      - Do not introduce new unmet-need proof, new evidence authority, value assessment, package, promotion, or PaperProject objects.
      - Each admissible candidate must include an answerability plan, claim ceiling fit, excluded claims, allowed refinements, and falsification conditions.

  - prompt_template_id: topic-selection-topic-value-assessment
    version: 1
    runtime_profile_id: topic_selection_topic_value_assessment.v1
    description: Assess v1b TopicQuestion value from the active question contract and selected ResearchSlice snapshot.
    variables_schema:
      type: object
      required: [topic_value_assessment_input_json, research_slice_snapshot_json]
      properties:
        topic_value_assessment_input_json:
          type: object
        research_slice_snapshot_json:
          type: object
    notes:
      - Return only JSON matching the TopicValueAssessment structured reasoning schema.
      - Cite only refs inherited from the T-059 value handoff and T-057 ResearchSlice snapshot.
      - Do not prove a new unmet need, create new evidence authority, rewrite the question, or expand the slice.
      - Do not create a TopicPackage, promotion decision, PaperProject, or package-readiness claim.
      - advance_to_package only means the draft-package handoff may be prepared by deterministic service logic.

  - prompt_template_id: topic-selection-promotion-decision-support
    version: 1
    runtime_profile_id: topic_selection_promotion_decision_support.v1
    description: Draft reviewer-facing support prose for v1c promotion review from a frozen PromotionInputSnapshotHandoff.
    variables_schema:
      type: object
      required: [promotion_input_handoff_json]
      properties:
        promotion_input_handoff_json:
          type: object
    notes:
      - Return only JSON with summary, reviewer_questions, risk_notes, recheck_notes, and dossier_markdown.
      - Do not output or override a promotion gate disposition.
      - Do not authorize promotion, create human decisions, create PaperProject bridges, or modify v1b/T-061 authority objects.
      - Copy refs only from the supplied PromotionInputSnapshotHandoff.

  - prompt_template_id: topic-selection-v1c-promotion-support-bounded-micro-debate
    version: 1
    runtime_profile_id: topic-selection.v1c.promotion-support.bounded-micro-debate.codex.v1
    description: Run one fixed-role Codex call within the v1c N2 bounded micro-debate acceptance workflow.
    variables_schema:
      type: object
      required: [role_slot, context_packet_json, prior_role_outputs_json]
      properties:
        role_slot:
          type: string
        context_packet_json:
          type: object
        prior_role_outputs_json:
          type: object
    notes:
      - Return only JSON for the requested role slot.
      - Do not output gate disposition, promotion decision, bridge authorization, or downstream mutation fields.
      - Copy refs only from the provided N1-derived context packet.
      - The synthesizer.final output must include N3-readable semantic slots and critic-finding resolution coverage.

  - prompt_template_id: topic-selection-v1c-gate-diagnostic-adjunct
    version: 1
    runtime_profile_id: topic-selection.v1c.gate-diagnostic-adjunct.codex.v1
    description: Produce Codex diagnostic guidance after a deterministic N3 action_required gate without changing routing authority.
    variables_schema:
      type: object
      required: [gate_result_json, allowed_refs_json]
      properties:
        gate_result_json:
          type: object
        allowed_refs_json:
          type: array
    notes:
      - Return only diagnostic JSON.
      - Do not change or restate a new routing outcome.
      - Any repair suggestions must point to existing required_actions or allowed refs.

  - prompt_template_id: topic-selection-v1c-codex-delegated-promotion-decision
    version: 1
    runtime_profile_id: topic-selection.v1c.codex-delegated-promotion-decision.codex.v1
    description: Produce a structured N4 delegated promotion decision candidate under an explicit authorization envelope.
    variables_schema:
      type: object
      required: [delegation_envelope_json, gate_handoff_json]
      properties:
        delegation_envelope_json:
          type: object
        gate_handoff_json:
          type: object
    notes:
      - Return only the delegated decision candidate JSON.
      - The candidate is not authority until deterministic N4 admission passes.
      - Do not create PaperProjectBridge or downstream intake fields.
      - Copy refs and hashes exactly from the supplied gate handoff and authorization envelope.

  - prompt_template_id: topic-selection-v1c-downstream-feedback-normalization
    version: 1
    runtime_profile_id: topic-selection.v1c.downstream-feedback-normalization.codex.v1
    description: Normalize semi-structured downstream feedback into the v1c N6 structured feedback candidate contract.
    variables_schema:
      type: object
      required: [bridge_context_json, raw_feedback_text]
      properties:
        bridge_context_json:
          type: object
        raw_feedback_text:
          type: string
    notes:
      - Return only the structured feedback candidate JSON.
      - Do not invent refs, mutate bridge or promotion records, or create recheck artifacts directly.
      - Recheck-producing feedback must include a non-empty required_action.

  - prompt_template_id: paper-implementation-trace-integrity-boundary-debate
    version: 2
    runtime_profile_id: paper-implementation.trace-integrity.boundary-debate.v1
    description: Run one fixed role in the PaperImplementation trace-integrity boundary debate runtime slot.
    variables_schema:
      type: object
      required: [role_slot_id, retrieval_packet_ref, retrieval_packet_hash, reviewed_statement_refs, source_refs]
      properties:
        role_slot_id:
          type: string
        retrieval_packet_ref:
          type: object
        retrieval_packet_hash:
          type: string
        reviewed_statement_refs:
          type: array
        source_refs:
          type: array
        prior_role_artifact_refs:
          type: array
    notes:
      - Return only the TraceIntegrityRoleArtifact JSON for the requested role slot.
      - Cite only refs from the bounded retrieval packet; prior role artifacts are context and must not be used as cited refs.
      - Do not write trace repairs, claims, dossier readiness, work orders, queue items, prompt text, or raw provider output.
      - Semantic blockers must use the trace-integrity blocker taxonomy documented in T-114.
      - "v2 (T-124 S3-α2): each role emits its structured section — support_mapper_map: per_statement_support_map covering every reviewed statement (support_kind direct|partial|background_only|conflicting|missing; non-missing entries cite packet refs); skeptic_challenge: challenge_findings (unique finding_id, severity blocker|major|minor, taxonomy blocker_code, packet-backed target_statement_ref and cited_refs); support_mapper_reconcile: finding_dispositions with exactly one disposition per skeptic finding (resolved/rebutted require non-empty cited_refs); arbiter_final: coverage over every reviewed statement and every finding_id, accepted blocker codes carried into blocker_codes."
      - "v2 applies to both passed and blocked role outputs — a blocked verdict must still be structurally complete."

  - prompt_template_id: paper-implementation-claim-boundary-debate
    version: 1
    runtime_profile_id: paper-implementation.claim-boundary.boundary-debate.v1
    description: Run one fixed role in the PaperImplementation claim-boundary debate runtime slot.
    variables_schema:
      type: object
      required: [slot_id, role_slot_id, target_ref, source_refs, source_hash_bundle_hash]
      properties:
        slot_id:
          type: string
        role_slot_id:
          type: string
        target_ref:
          type: object
        source_refs:
          type: array
        source_hash_bundle_hash:
          type: string
        prior_role_artifact_refs:
          type: array
    notes:
      - Return only the PaperImplementationP1RuntimeReviewRoleArtifact JSON for the requested role slot.
      - Final adjudicator output may include a domain_gate_request for CreateClaimCandidateRequest only.
      - Do not create claims, trace packets, dossiers, queue items, prompt text, or raw provider output directly.
      - Preserve forbidden_overclaims, support/challenge refs, claim trace refs, and failed-run accounting.

  - prompt_template_id: paper-implementation-dossier-readiness-audit
    version: 1
    runtime_profile_id: paper-implementation.dossier-readiness.readiness-audit.v1
    description: Run one fixed role in the PaperImplementation dossier-readiness audit runtime slot.
    variables_schema:
      type: object
      required: [slot_id, role_slot_id, target_ref, source_refs, source_hash_bundle_hash]
      properties:
        slot_id:
          type: string
        role_slot_id:
          type: string
        target_ref:
          type: object
        source_refs:
          type: array
        source_hash_bundle_hash:
          type: string
        prior_role_artifact_refs:
          type: array
    notes:
      - Return only the PaperImplementationP1RuntimeReviewRoleArtifact JSON for the requested role slot.
      - Final adjudicator output may include a domain_gate_request for CreateImplementationDossierRequest only.
      - Do not create dossiers, writing packets, claims, queue items, prompt text, or raw provider output directly.
      - Preserve claim trace refs, failed/inconclusive run refs, readiness blockers, and scenario alternatives.

  - prompt_template_id: paper-implementation-result-analysis-scenarios
    version: 1
    runtime_profile_id: paper-implementation.result-analysis.interpretation-scenarios.v1
    description: Run the fixed PaperImplementation result-analysis interpretation-scenario runtime role.
    variables_schema:
      type: object
      required: [slot_id, role_slot_id, target_ref, source_refs, source_hash_bundle_hash]
      properties:
        slot_id:
          type: string
        role_slot_id:
          type: string
        target_ref:
          type: object
        source_refs:
          type: array
        source_hash_bundle_hash:
          type: string
        required_scenario_kinds:
          type: array
    notes:
      - Return only the PaperImplementationResultAnalysisRoleArtifact JSON for the interpretation-scenario role.
      - Passed output must include scenario_outputs and a domain_gate_request for CreateResultInterpretationPacketRequest only.
      - Interpretations are not evidence; keep run evidence, validation reports, failed runs, limitations, and follow-up refs separate.
      - Do not create result packets, claims, dossiers, writing packets, queue items, prompt text, or raw provider output directly.

  - prompt_template_id: paper-implementation-experiment-design-work-order-draft
    version: 1
    runtime_profile_id: paper-implementation.experiment-design.work-order-draft.v1
    description: Run the fixed PaperImplementation experiment-design WorkOrder draft proposal runtime role.
    variables_schema:
      type: object
      required: [slot_id, role_slot_id, target_ref, source_refs, source_hash_bundle_hash]
      properties:
        slot_id:
          type: string
        role_slot_id:
          type: string
        target_ref:
          type: object
        source_refs:
          type: array
        source_hash_bundle_hash:
          type: string
    notes:
      - Return only the PaperImplementationExperimentPlanningRoleArtifact JSON for the WorkOrder designer role.
      - Passed output must include at least two work_order_draft_candidates with explicit confirmatory/exploratory separation.
      - Candidates may contain WorkOrder draft request payloads but must not create or admit WorkOrders directly.
      - Do not submit live experiments, create queue items, prompt text, or raw provider output.

  - prompt_template_id: paper-implementation-route-architecture-route-candidates
    version: 1
    runtime_profile_id: paper-implementation.route-architecture.route-candidates.v1
    description: Run the fixed PaperImplementation route-architecture candidate proposal runtime role.
    variables_schema:
      type: object
      required: [slot_id, role_slot_id, target_ref, source_refs, source_hash_bundle_hash]
      properties:
        slot_id:
          type: string
        role_slot_id:
          type: string
        target_ref:
          type: object
        source_refs:
          type: array
        source_hash_bundle_hash:
          type: string
    notes:
      - Return only the PaperImplementationRoutePlanningRoleArtifact JSON for the route candidate designer role.
      - Passed output must include at least two route_candidate_proposals with explicit confirmatory/exploratory separation.
      - Proposals are not TechnicalRouteCandidate records and must not include create/update/admit route payloads.
      - Do not create validation cycles, feasibility probes, queue items, Domain Gate requests, prompt text, or raw provider output.

  - prompt_template_id: paper-implementation-route-skeptic-review-route-risk-critique
    version: 1
    runtime_profile_id: paper-implementation.route-skeptic-review.route-risk-critique.v1
    description: Run the fixed PaperImplementation independent route-risk critique runtime role.
    variables_schema:
      type: object
      required: [slot_id, role_slot_id, target_ref, source_refs, source_hash_bundle_hash, required_risk_dimensions]
      properties:
        slot_id:
          type: string
        role_slot_id:
          type: string
        target_ref:
          type: object
        source_refs:
          type: array
        source_hash_bundle_hash:
          type: string
        admitted_route_proposal_artifact_hash:
          type: string
        required_risk_dimensions:
          type: array
    notes:
      - Return only the PaperImplementationRoutePlanningRoleArtifact JSON for the independent route critic role.
      - The admitted route proposal runtime artifact is the primary input; TechnicalRouteCandidate refs are secondary context only.
      - "T-124 S3 复审 F3-4 — echo the reviewed upstream identity verbatim: reviewed_route_proposal_ref / reviewed_route_proposal_hash must equal the request admitted_route_proposal_artifact_ref / admitted_route_proposal_artifact_hash, and reviewed_candidate_keys must equal the request reviewed_candidate_keys set. The runtime reconciles these against the request-injected values (via functionalRefEquals / set equality) for both passed and blocked outputs; a present-but-drifted echo fails closed as a retryable ROUTE_SKEPTIC_ROUTE_PROPOSAL_MISMATCH / ROUTE_SKEPTIC_CANDIDATE_KEY_MISMATCH rather than being admitted."
      - Passed output must cover all required risk dimensions, set no_queue_side_effect=true, and include a recommended_disposition.
      - Do not create or update routes, validation cycles, feasibility probes, queue items, Domain Gate requests, prompt text, or raw provider output.

  - prompt_template_id: paper-implementation-validation-cycle-planning-cycle-candidates
    version: 1
    runtime_profile_id: paper-implementation.validation-cycle-planning.cycle-candidates.v1
    description: Run the fixed PaperImplementation validation-cycle candidate proposal runtime role.
    variables_schema:
      type: object
      required:
        - slot_id
        - role_slot_id
        - target_ref
        - source_refs
        - source_hash_bundle_hash
        - admitted_route_proposal_artifact_hash
        - admitted_route_skeptic_artifact_hash
        - reviewed_candidate_keys
      properties:
        slot_id:
          type: string
        role_slot_id:
          type: string
        target_ref:
          type: object
        source_refs:
          type: array
        source_hash_bundle_hash:
          type: string
        admitted_route_proposal_artifact_hash:
          type: string
        admitted_route_skeptic_artifact_hash:
          type: string
        reviewed_candidate_keys:
          type: array
    notes:
      - Return only the PaperImplementationValidationCyclePlanningRoleArtifact JSON for the cycle candidate designer role.
      - The admitted route proposal and admitted route skeptic artifacts are primary inputs; deterministic route refs are secondary context only.
      - Passed output must include at least two cycle_candidate_proposals with pass, fail, inconclusive, budget, trace, and expected information gain fields.
      - Do not create validation cycles, feasibility probes, queue items, Domain Gate requests, prompt text, or raw provider output.

  - prompt_template_id: paper-implementation-feasibility-planning-probe-plan-candidates
    version: 1
    runtime_profile_id: paper-implementation.feasibility-planning.probe-plan-candidates.v1
    description: Run the fixed PaperImplementation feasibility probe/plan candidate proposal runtime role.
    variables_schema:
      type: object
      required:
        - slot_id
        - role_slot_id
        - target_ref
        - source_refs
        - source_hash_bundle_hash
        - admitted_validation_cycle_artifact_hash
        - admitted_route_proposal_artifact_hash
        - admitted_route_skeptic_artifact_hash
        - reviewed_cycle_candidate_keys
        - reviewed_route_candidate_keys
      properties:
        slot_id:
          type: string
        role_slot_id:
          type: string
        target_ref:
          type: object
        source_refs:
          type: array
        source_hash_bundle_hash:
          type: string
        admitted_validation_cycle_artifact_hash:
          type: string
        admitted_route_proposal_artifact_hash:
          type: string
        admitted_route_skeptic_artifact_hash:
          type: string
        reviewed_cycle_candidate_keys:
          type: array
        reviewed_route_candidate_keys:
          type: array
    notes:
      - Return only the PaperImplementationFeasibilityPlanningRoleArtifact JSON for the probe/plan candidate designer role.
      - The admitted validation-cycle candidate artifact is the primary input; route proposal and route skeptic artifacts are lineage anchors only.
      - Passed output must include at least two probe_plan_candidate_proposals with probe kind, baseline gap status, metric/data/baseline/code/config refs, budget envelope, stop conditions, information gain, and trace refs.
      - Do not create feasibility probes, experiment plan-light records, validation cycles, queue items, Domain Gate requests, prompt text, or raw provider output.

  - prompt_template_id: paper-implementation-cross-board-synthesis-merge-split-reuse-scenarios
    version: 1
    runtime_profile_id: paper-implementation.cross-board-synthesis.merge-split-reuse-scenarios.v1
    description: Run the fixed PaperImplementation cross-board merge/split/reuse scenario proposal runtime role.
    variables_schema:
      type: object
      required:
        - slot_id
        - role_slot_id
        - target_ref
        - source_refs
        - source_hash_bundle_hash
        - board_anchors
        - reviewed_board_version_refs
        - reviewed_conflict_refs
        - reviewed_challenge_refs
        - evidence_transfer_binding_refs
        - reuse_policy
      properties:
        slot_id:
          type: string
        role_slot_id:
          type: string
        target_ref:
          type: object
        source_refs:
          type: array
        source_hash_bundle_hash:
          type: string
        board_anchors:
          type: array
        reviewed_board_version_refs:
          type: array
        reviewed_conflict_refs:
          type: array
        reviewed_challenge_refs:
          type: array
        evidence_transfer_binding_refs:
          type: array
        reuse_policy:
          type: object
    notes:
      - Return only the PaperImplementationCrossBoardSynthesisRoleArtifact JSON for the merge/split/reuse scenario designer role.
      - Board anchors are the primary inputs; CrossBoardReview, EvidenceTransferBinding, portfolio, and motive-evolution records are downstream domain-service concerns.
      - Passed output must preserve board version refs/hashes, conflict/challenge refs, source locator refs, and EvidenceTransferBinding refs when reuse is viable.
      - Do not create CrossBoardReview records, EvidenceTransferBinding records, motive portfolio decisions, motive evolution decisions, queue items, Domain Gate requests, prompt text, or raw provider output.

  - prompt_template_id: paper-implementation-evidence-board-curation-binding-gap-candidates
    version: 1
    runtime_profile_id: paper-implementation.evidence-board-curation.binding-gap-candidates.v1
    description: Run the fixed PaperImplementation evidence-board binding/gap candidate curation runtime role.
    variables_schema:
      type: object
      required:
        - slot_id
        - role_slot_id
        - curation_mode
        - target_ref
        - target_assertion_refs
        - source_refs
        - source_hash_bundle_hash
        - trace_manifest_refs
        - source_locator_refs
        - citation_candidate_refs
        - reviewed_citation_candidate_refs
        - evidence_refs
        - existing_evidence_binding_refs
      properties:
        slot_id:
          type: string
        role_slot_id:
          type: string
        curation_mode:
          type: string
        target_ref:
          type: object
        target_assertion_refs:
          type: array
        source_refs:
          type: array
        source_hash_bundle_hash:
          type: string
        trace_manifest_refs:
          type: array
        source_locator_refs:
          type: array
        citation_candidate_refs:
          type: array
        reviewed_citation_candidate_refs:
          type: array
        evidence_refs:
          type: array
        existing_evidence_binding_refs:
          type: array
    notes:
      - Return only the PaperImplementationEvidenceBoardCurationRoleArtifact JSON for the binding/gap candidate curator role.
      - The runtime output is append-only: produce new binding_candidate_proposals and gap_candidate_proposals only.
      - Every binding candidate must include challenge_check and preserve assertion, evidence, source locator, citation candidate, trace, board, and existing binding refs exactly.
      - Do not create or update board versions, evidence bindings, transfer bindings, citation candidates, trace repair queue items, queue items, Domain Gate requests, prompt text, or raw provider output.

  - prompt_template_id: paper-implementation-motive-decomposition-draft-assertion-candidates
    version: 1
    runtime_profile_id: paper-implementation.motive-decomposition.draft-assertion-candidates.v1
    description: Run the fixed PaperImplementation motive decomposition draft assertion candidate runtime role.
    variables_schema:
      type: object
      required:
        - slot_id
        - role_slot_id
        - decomposition_mode
        - target_ref
        - target_motive_ref
        - target_core_motive_version_ref
        - target_assertion_refs
        - source_refs
        - source_hash_bundle_hash
        - assertion_context_packets
        - trace_manifest_refs
        - source_locator_refs
        - citation_candidate_refs
        - evidence_refs
      properties:
        slot_id:
          type: string
        role_slot_id:
          type: string
        decomposition_mode:
          type: string
        target_ref:
          type: object
        target_motive_ref:
          type: object
        target_core_motive_version_ref:
          type: object
        target_assertion_refs:
          type: array
        source_refs:
          type: array
        source_hash_bundle_hash:
          type: string
        assertion_context_packets:
          type: array
        trace_manifest_refs:
          type: array
        source_locator_refs:
          type: array
        citation_candidate_refs:
          type: array
        evidence_refs:
          type: array
    notes:
      - Return only the PaperImplementationMotiveDecompositionRoleArtifact JSON for the draft assertion candidate designer role.
      - The runtime proposes draft_assertion_candidates only for existing request-owned assertion context; it does not discover missing assertions or rewrite motive state.
      - Every candidate must include decomposition_check, request-owned covered refs, and a recommended_next_gate; new-claim risk must require human confirmation or motive evolution review.
      - Keep decomposition_result_status and role_status aligned: blocked results use role_status blocked, while candidates_proposed and no_decomposition_needed use role_status passed.
      - Do not create MotiveAssertion, CoreMotiveVersion, MotiveEvolutionDecision, board, evidence binding, trace repair queue, queue, Domain Gate, prompt text, source_assertion_reviews, or raw provider output payloads.

  - prompt_template_id: paper-implementation-motive-evolution-decision-support
    version: 2
    runtime_profile_id: paper-implementation.motive-evolution.evolution-decision-support.v1
    description: Run the fixed PaperImplementation motive evolution decision-support runtime roles.
    variables_schema:
      type: object
      required:
        - slot_id
        - role_slot_id
        - target_ref
        - target_motive_refs
        - target_core_motive_version_refs
        - source_refs
        - source_hash_bundle_hash
        - motive_context_packets
        - portfolio_snapshot_ref
        - evidence_board_refs
        - evidence_binding_refs
        - trace_manifest_refs
        - human_confirmation_policy_ref
      properties:
        slot_id:
          type: string
        role_slot_id:
          type: string
        target_ref:
          type: object
        target_motive_refs:
          type: array
        target_core_motive_version_refs:
          type: array
        source_refs:
          type: array
        source_hash_bundle_hash:
          type: string
        motive_context_packets:
          type: array
        portfolio_snapshot_ref:
          type: object
        evidence_board_refs:
          type: array
        evidence_binding_refs:
          type: array
        challenge_refs:
          type: array
        conflict_refs:
          type: array
        trace_manifest_refs:
          type: array
        validation_cycle_refs:
          type: array
