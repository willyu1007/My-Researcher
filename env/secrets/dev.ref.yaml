version: 1
secrets:
  database_url:
    backend: mock
    ref: mock://dev/database_url
    hint: Local Prisma dev DB URL. Recommended schema is my_researcher_dev, for example postgresql://<local-os-user>@127.0.0.1:5432/postgres?schema=my_researcher_dev.
  openai_api_key:
    backend: envfile
    ref: "envfile:.env.local#OPENAI_API_KEY"
    hint: Local OpenAI API key stored in gitignored .env.local.
  dashscope_api_key:
    backend: envfile
    ref: "envfile:.env.local#DASHSCOPE_API_KEY"
    hint: Local DashScope API key stored in gitignored .env.local.
  dashscope_api_key_coding:
    backend: envfile
    ref: "envfile:.env.local#DASHSCOPE_API_KEY_CODING"
    hint: Local DashScope coding API key stored in gitignored .env.local.
  deepseek_api_key:
    backend: envfile
    ref: "envfile:.env.local#DEEPSEEK_API_KEY"
    hint: Local DeepSeek API key stored in gitignored .env.local.
  openalex_api_key:
    backend: envfile
    ref: "envfile:.env.local#OPENALEX_API_KEY"
    hint: Optional OpenAlex API key stored in gitignored .env.local for high-volume literature discovery.
  semantic_scholar_api_key:
    backend: envfile
    ref: "envfile:.env.local#SEMANTIC_SCHOLAR_API_KEY"
    hint: Optional Semantic Scholar Graph API key stored in gitignored .env.local for literature discovery.
  alibaba_cloud_access_key_id:
    backend: envfile
    ref: "envfile:.env.local#ALIBABA_CLOUD_ACCESS_KEY_ID"
    hint: Temporary STS AccessKey ID for the dedicated zero-write Aliyun PAI preflight identity.
  alibaba_cloud_access_key_secret:
    backend: envfile
    ref: "envfile:.env.local#ALIBABA_CLOUD_ACCESS_KEY_SECRET"
    hint: Temporary STS AccessKey secret for the dedicated zero-write Aliyun PAI preflight identity.
  alibaba_cloud_security_token:
    backend: envfile
    ref: "envfile:.env.local#ALIBABA_CLOUD_SECURITY_TOKEN"
    hint: Temporary STS security token for the dedicated zero-write Aliyun PAI preflight identity.
