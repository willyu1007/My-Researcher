# LLM configuration keys registry
#
# This file is an allow-list of LLM-related configuration keys / environment variables.
# It is enforced by: `node .ai/skills/workflows/llm/llm-engineering/scripts/check-llm-config-keys.mjs`.

version: 1

keys:
  - LLM_DEFAULT_PROFILE
  - LLM_PROVIDER_REGISTRY_PATH
  - LLM_PROMPT_REGISTRY_PATH
  - LLM_CREDENTIALS_RESOLVER
  - OPENAI_API_KEY
  - DASHSCOPE_API_KEY
  - DASHSCOPE_API_KEY_CODING
  - DASHSCOPE_BASE_URL
  - DEEPSEEK_API_KEY
  - DEEPSEEK_BASE_URL
  - CODEX_CLI_PATH
  - TOPIC_SELECTION_REAL_LLM_TIMEOUT_MS
  - TOPIC_SELECTION_REAL_RUN_ID
  - TOPIC_SELECTION_V1C_REAL_CODEX_RUN_ID
  - TOPIC_SELECTION_V1C_REAL_CODEX_SAMPLE_COUNT
  - TOPIC_SELECTION_V1C_REAL_CODEX_TIMEOUT_MS
  - TOPIC_SELECTION_V1C_REAL_CODEX_BIN
  - TOPIC_SELECTION_V1C_REAL_CODEX_MODEL
  - TOPIC_SELECTION_V1C_REAL_CODEX_REASONING_EFFORT
  - TOPIC_SELECTION_V1C_REAL_CODEX_GATE
  - TOPIC_SELECTION_V1C_PROVIDER_CANARY_RUN_ID
  - TOPIC_SELECTION_V1C_PROVIDER_CANARY_GATE
  - TOPIC_SELECTION_V1C_PROVIDER_CANARY_SAMPLE_COUNT
  - TOPIC_SELECTION_V1C_PROVIDER_CANARY_MODEL_OPTION_SUFFIXES
  - TOPIC_SELECTION_V1C_PROVIDER_CANARY_TIMEOUT_MS
  - T114_TRACE_INTEGRITY_PROVIDER_CANARY_LIVE
  - T114_P1_CLAIM_BOUNDARY_PROVIDER_CANARY_LIVE
  - T114_P1_DOSSIER_READINESS_PROVIDER_CANARY_LIVE
  - T114_PROVIDER_FAIL_CLOSED_CANARY_LIVE
  - T114_RESULT_ANALYSIS_PROVIDER_CANARY_LIVE
  - T114_EXPERIMENT_DESIGN_PROVIDER_CANARY_LIVE
  - T114_EXPERIMENT_CRITIQUE_PROVIDER_CANARY_LIVE
  - PAPER_IMPLEMENTATION_PROVIDER_CANARY_PROVIDER_ID

# Prefixes that mark an environment/config key as LLM-related.
# Keys that match these prefixes MUST be explicitly listed in `keys`.
scope_prefixes:
  - LLM_
  # Common provider prefixes (optional; adjust per org)
  - OPENAI_
  - ANTHROPIC_
  - AZURE_OPENAI_
  - GOOGLE_
  - GEMINI_
  - DASHSCOPE_
  - DEEPSEEK_
