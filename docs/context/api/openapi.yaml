openapi: 3.1.0
info:
  title: Paper Engineering Assistant API
  version: 0.1.0
  description: |
    Canonical REST contract for backend routes used by desktop literature and governance workflows.
servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: health
    description: Service health endpoint.
  - name: research-lifecycle
    description: Paper project lifecycle and governance endpoints.
  - name: literature
    description: Literature import, scope, overview, and metadata endpoints.
  - name: settings
    description: Local application settings and provider configuration endpoints.
  - name: topic-settings
    description: Topic profile settings for auto-pull.
  - name: auto-pull
    description: Rule-driven automatic pull, runs, and alerts.
  - name: topic-research
    description: Topic-level research question, need, package, and promotion endpoints.
  - name: topic-selection-v1a
    description: Topic selection v1a evidence-to-need decision-chain endpoints.
  - name: topic-selection-v1b
    description: Topic selection v1b need-to-draft-package and frozen replay endpoints.
  - name: topic-selection-v1c
    description: Topic selection v1c human promotion, bridge, downstream feedback, and frozen replay endpoints.
  - name: paper-implementation-experiment-v2
    description: PI experiment v2 admission, closure, lineage, and agent-action surfaces; committed sagas are relayed through domain-local database inbox/outbox consumers.
  - name: experiment-foundation-execution-v2
    description: Default-off simulation and real-provider execution intake plus durable Attempt control endpoints; simulation and real-provider outputs remain ineligible for scientific evidence.
  - name: experiment-foundation-promotion-v2
    description: Default-off typed Candidate catalog promotion with server-owned canonicalization and atomic decision/outbox persistence.

paths:
  /health:
    get:
      operationId: getHealth
      summary: Check service liveness.
      tags: [health]
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /paper-implementation/projects/{implementation_project_id}/validation-cycles/{validation_cycle_id}/experiment-work-orders/v2/admissions:
    post:
      operationId: admitPaperImplementationExperimentWorkOrderV2
      summary: Admit one immutable PI experiment WorkOrder revision and its exact ordered cells.
      description: |
        The server derives all canonical hashes and the branch-local revision sequence. The default-off
        admission capability rejects before any PI v2, EF v2 or legacy write. Disabling admission does
        not stop relay or consumer processing for a previously committed saga.
      tags: [paper-implementation-experiment-v2]
      parameters:
        - name: implementation_project_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: validation_cycle_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaperImplementationExperimentV2AdmissionRequest'
      responses:
        '201':
          description: Admission committed or exact-replayed without duplicate authority rows/events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperImplementationExperimentV2AdmissionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /paper-implementation/validation-cycles/{validation_cycle_id}/closure/v2:
    post:
      operationId: closePaperImplementationValidationCycleV2
      summary: Close one ValidationCycle against an exact server-derived closure watermark.
      description: |
        The path owns ValidationCycle identity. The same identifier MAY be omitted from the body; when
        supplied it must match the path. The server rejects caller-authored closure authority, stale
        watermarks, active real Attempts, and non-frozen current branch heads before committing.
      tags: [paper-implementation-experiment-v2]
      parameters:
        - name: validation_cycle_id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaperImplementationValidationCycleClosureV2Request'
      responses:
        '201':
          description: ValidationCycle closure committed or exact-replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperImplementationValidationCycleClosureV2Response'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /paper-implementation/validation-cycles/{validation_cycle_id}/closure/v2/readiness:
    get:
      operationId: getPaperImplementationValidationCycleClosureReadinessV2
      summary: Rebuild closure readiness and the exact ValidationCycle closure watermark.
      description: The evaluation is server-derived and read-only; it is not a second closure authority.
      tags: [paper-implementation-experiment-v2]
      parameters:
        - name: validation_cycle_id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Current closure readiness, blockers, and exact closure watermark.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperImplementationValidationCycleReadinessV2'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /paper-implementation/projects/{implementation_project_id}/experiment-lineage/validation-cycles:
    get:
      operationId: listPaperImplementationProjectValidationCycleLineageV2
      summary: List experiment-lineage summaries for one ImplementationProject.
      tags: [paper-implementation-experiment-v2]
      parameters:
        - name: implementation_project_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 512, pattern: '\S' }
      responses:
        '200':
          description: Project-scoped ValidationCycle lineage summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperImplementationProjectValidationCyclesLineageV2Response'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /paper-implementation/projects/{implementation_project_id}/validation-cycles/{validation_cycle_id}/experiment-lineage:
    get:
      operationId: getPaperImplementationValidationCycleExperimentLineageV2
      summary: Read current admitted branch, head Run, Attempt, and collection lineage for one ValidationCycle.
      tags: [paper-implementation-experiment-v2]
      parameters:
        - name: implementation_project_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 512, pattern: '\S' }
        - name: validation_cycle_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 512, pattern: '\S' }
      responses:
        '200':
          description: Exact current ValidationCycle experiment lineage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperImplementationValidationCycleExperimentLineageV2Response'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /paper-implementation/projects/{implementation_project_id}/workorder-branches/{branch_id}/revision-history:
    get:
      operationId: getPaperImplementationWorkOrderBranchRevisionHistoryV2
      summary: Read all admitted and superseded WorkOrder revisions for one experiment branch.
      tags: [paper-implementation-experiment-v2]
      parameters:
        - name: implementation_project_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 512, pattern: '\S' }
        - name: branch_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 512, pattern: '\S' }
      responses:
        '200':
          description: Branch-local revision history including superseded revisions and exact Run refs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperImplementationWorkOrderBranchRevisionHistoryV2Response'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /paper-implementation/validation-cycles/{validation_cycle_id}/closure/v2/preparation:
    get:
      operationId: preparePaperImplementationValidationCycleClosureV2
      summary: Prepare the exact no-evidence closure request template for one ValidationCycle.
      description: |
        Returns current readiness and, when ready, a server-derived closure body whose sole unresolved
        caller value is the business idempotency key. Scientific closure remains explicitly gated.
      tags: [paper-implementation-experiment-v2]
      parameters:
        - name: validation_cycle_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 512, pattern: '\S' }
      responses:
        '200':
          description: Closure readiness and an optional exact request template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperImplementationValidationCycleClosurePreparationV2Response'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /paper-implementation/projects/{implementation_project_id}/validation-cycles/{validation_cycle_id}/available-actions:
    get:
      operationId: listPaperImplementationValidationCycleAvailableActionsV2
      summary: List typed agent actions currently available for one ValidationCycle.
      description: The read-only projection returns server-owned methods, paths, capability gates, confirmation scopes, and subjects.
      tags: [paper-implementation-experiment-v2]
      parameters:
        - name: implementation_project_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 512, pattern: '\S' }
        - name: validation_cycle_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 512, pattern: '\S' }
      responses:
        '200':
          description: Current project-scoped available actions and closure state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperImplementationValidationCycleAvailableActionsV2Response'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /experiment-foundation/v2/assets/{asset_type}/{logical_id}/candidate-revisions/{candidate_revision}/promotion:
    post:
      operationId: decideExperimentFoundationAssetPromotionV2
      summary: Promote or reject one exact typed asset Candidate revision.
      description: |
        The caller supplies only the public typed asset identity, exact Candidate revision, intended
        decision and idempotency key. The server derives Candidate/canonical identities and hashes,
        then atomically commits the terminal decision, created-or-exact-reused canonical revision,
        Candidate transition and one outbox event. Reject creates no canonical revision. This endpoint
        is default-off and requires the committed v2 cutover; the legacy generic promotion route remains closed.
      tags: [experiment-foundation-promotion-v2]
      parameters:
        - name: asset_type
          in: path
          required: true
          schema:
            type: string
            enum: [Dataset, DataPolicy, MetricDefinition, Benchmark, EvaluationProtocol]
        - name: logical_id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - name: candidate_revision
          in: path
          required: true
          schema: { type: integer, format: int32, minimum: 1, maximum: 2147483647 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentFoundationPromotionV2Request'
      responses:
        '201':
          description: The exact terminal promotion outcome was created atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentFoundationPromotionV2Response'
        '200':
          description: The exact terminal promotion outcome was replayed without new canonical, Candidate, decision or outbox rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentFoundationPromotionV2Response'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /experiment-foundation/v2/exploration-specifications/{logical_id}/revisions:
    post:
      operationId: createExperimentFoundationExplorationSpecRevisionV2
      summary: Create or exact-reuse one immutable exploration specification revision.
      description: |
        Freezes a proposed branch frame, typed WorkOrder revision snapshot and ordered exact cells
        as a server-identified ExperimentFoundation revision. Exact content reuses the existing
        revision without creating a row; changed content requires the current state version and
        creates the next revision atomically. This default-off endpoint grants no execution,
        result, validation or evidence authority and requires the committed v2 cutover.
      tags: [experiment-foundation-exploration-spec-v2]
      parameters:
        - name: logical_id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentFoundationExplorationSpecV2CreateRevisionRequest'
      responses:
        '201':
          description: A new immutable exploration specification revision was created atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentFoundationExplorationSpecV2CreateRevisionResponse'
        '200':
          description: The exact content was replayed without creating a new identity or revision row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentFoundationExplorationSpecV2CreateRevisionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /experiment-foundation/v2/runs/{run_id}/workflow-simulations:
    post:
      operationId: startExperimentFoundationWorkflowSimulationV2
      summary: Start or exact-replay simulation Attempts for every required Run cell.
      description: |
        Requires the exact processed Pack A head acknowledgement, unchanged Run manifest, ordered
        RunCell/TaskSpec bindings and exact readiness authority. The server materializes and hashes the
        fake-provider payload. Capability-off blocks only new intake; committed commands continue to drain.
      tags: [experiment-foundation-execution-v2]
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentFoundationWorkflowSimulationV2StartRequest'
      responses:
        '201':
          description: Simulation Attempts and durable submit commands were created for the exact required cells.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentFoundationWorkflowSimulationV2StartResponse'
        '200':
          description: The exact business command was replayed without duplicate authority or provider intent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentFoundationWorkflowSimulationV2StartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /experiment-foundation/v2/runs/{run_id}/real-provider-executions:
    post:
      operationId: startExperimentFoundationRealProviderExecutionV2
      summary: Start or exact-replay real-provider Attempts for every required Run cell.
      description: |
        Requires the exact current head acknowledgement, an active exact ExecutionBundle revision, and
        the default-off real-provider intake capability. Provider payloads are server-materialized and
        redacted; provisional outputs are diagnostic-only and cannot become scientific evidence.
      tags: [experiment-foundation-execution-v2]
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentFoundationRealProviderExecutionV2StartRequest'
      responses:
        '201':
          description: Real-provider Attempts were created for the exact required cells.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentFoundationRealProviderExecutionV2StartResponse'
        '200':
          description: The exact business command was replayed without duplicate authority or provider intent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentFoundationRealProviderExecutionV2StartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /experiment-foundation/v2/execution-attempts/{attempt_id}/cancel:
    post:
      operationId: cancelExperimentFoundationExecutionAttemptV2
      summary: Persist an idempotent cancellation intent for one simulation Attempt.
      description: |
        Pending submit is cancelled with zero transport. If submit is already leased, cancellation is
        persisted as an unresolved durable intent and gains priority after E3 or lease recovery. A state
        conflict returns 409 with zero partial write; the same business key may be retried.
      tags: [experiment-foundation-execution-v2]
      parameters:
        - name: attempt_id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentFoundationExecutionAttemptV2ControlRequest'
      responses:
        '202':
          description: Cancellation completed atomically or was persisted as a durable command intent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentFoundationExecutionAttemptV2Response'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /experiment-foundation/v2/execution-attempts/{attempt_id}/reconcile:
    post:
      operationId: reconcileExperimentFoundationExecutionAttemptV2
      summary: Enqueue an idempotent manual reconciliation for one simulation Attempt.
      description: The durable fake-provider command uses the Attempt's exact payload hash and external identity; cancellation has precedence.
      tags: [experiment-foundation-execution-v2]
      parameters:
        - name: attempt_id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentFoundationExecutionAttemptV2ControlRequest'
      responses:
        '202':
          description: Reconciliation intent was committed or exact-replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentFoundationExecutionAttemptV2Response'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /experiment-foundation/v2/execution-attempts/{attempt_id}:
    get:
      operationId: getExperimentFoundationExecutionAttemptV2
      summary: Read one simulation Attempt authority record.
      tags: [experiment-foundation-execution-v2]
      parameters:
        - name: attempt_id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Exact simulation Attempt authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentFoundationExecutionAttemptV2Response'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /experiment-foundation/v2/runs/{run_id}/workflow-simulation-status:
    get:
      operationId: getExperimentFoundationWorkflowSimulationStatusV2
      summary: Rebuild the Run workflow simulation status from exact Attempt and collection facts.
      description: The response is a control projection only; scientific execution remains not_started and evidence eligibility remains false.
      tags: [experiment-foundation-execution-v2]
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Event-derived workflow simulation projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentFoundationWorkflowSimulationV2Status'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /paper-projects:
    post:
      operationId: createPaperProject
      summary: Create a paper project.
      tags: [research-lifecycle]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaperProjectRequest'
            example:
              title_card_id: title_card_001
              title: Retrieval-Augmented Generation Evaluation
              research_direction: LLM
              created_by: human
              initial_context:
                literature_evidence_ids:
                  - LIT-0001
                  - LIT-0002
      responses:
        '201':
          description: Paper project created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePaperProjectResponse'
              example:
                paper_id: P001
                status: active
                paper_active_sp_full: null
                paper_active_sp_partial: null
                created_at: '2026-02-27T08:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /paper-projects/{id}/version-spine/commit:
    post:
      operationId: commitVersionSpine
      summary: Commit a version spine node for a paper.
      tags: [research-lifecycle]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionSpineCommitRequest'
      responses:
        '200':
          description: Version spine node committed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionSpineCommitResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /paper-projects/{id}/stage-gates/{gate}/verify:
    post:
      operationId: verifyStageGate
      summary: Verify stage gate candidates for a paper.
      tags: [research-lifecycle]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: gate
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageGateVerifyRequest'
      responses:
        '200':
          description: Stage gate verification completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageGateVerifyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /paper-projects/{id}/writing-packages/build:
    post:
      operationId: buildWritingPackage
      summary: Build a writing package from a snapshot.
      tags: [research-lifecycle]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
