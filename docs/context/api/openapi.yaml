  schemas:
    ExperimentFoundationWorkflowSimulationV2StartRequest:
      type: object
      additionalProperties: false
      required: [business_idempotency_key]
      properties:
        business_idempotency_key: { type: string, minLength: 1 }

    ExperimentFoundationExecutionAttemptV2ControlRequest:
      type: object
      additionalProperties: false
      required: [business_idempotency_key]
      properties:
        business_idempotency_key: { type: string, minLength: 1 }
        reason_code:
          type: string
          enum: [operator_cancelled, manual_reconcile]

    ExperimentFoundationSimulationExternalJobRefV2:
      type: object
      additionalProperties: false
      required: [ref_type, ref_id]
      properties:
        ref_type: { const: fake_aliyun_pai_dlc_job }
        ref_id: { type: string, minLength: 1 }

    ExperimentFoundationProviderPayloadV2:
      type: object
      additionalProperties: false
      required: [provider_payload_id, materialization_key, run_id, run_manifest_hash, run_cell_id, cell_key, training_task_spec_id, training_task_spec_hash, payload_schema, adapter_identity, execution_mode, provenance, simulation_profile_version, redacted_manifest, payload_hash, payload_byte_size, created_at]
      properties:
        provider_payload_id: { type: string, minLength: 1 }
        materialization_key: { type: string, minLength: 1 }
        run_id: { type: string, minLength: 1 }
        run_manifest_hash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        run_cell_id: { type: string, minLength: 1 }
        cell_key: { type: string, minLength: 1 }
        training_task_spec_id: { type: string, minLength: 1 }
        training_task_spec_hash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        payload_schema: { const: 'FakeAliyunPaiDlcSubmitPayload@v1' }
        adapter_identity: { const: 'deterministic_fake_aliyun_pai_dlc@v1' }
        execution_mode: { const: simulation }
        provenance: { const: non_production_fake_provider }
        simulation_profile_version: { type: string, minLength: 1 }
        redacted_manifest:
          type: object
          description: Canonical redacted fake-provider payload manifest; credentials and network configuration are forbidden.
        payload_hash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        payload_byte_size: { type: integer, format: int32, minimum: 1, maximum: 2147483647 }
        created_at: { type: string, minLength: 1 }

    ExperimentFoundationExecutionAttemptV2:
      type: object
      additionalProperties: false
      required: [execution_attempt_id, external_pi_implementation_project_id, external_pi_validation_cycle_id, external_pi_branch_id, external_pi_work_order_revision_id, external_pi_work_order_revision_hash, external_pi_revision_sequence, run_id, run_manifest_hash, run_cell_id, cell_key, training_task_spec_id, training_task_spec_hash, provider_payload_id, provider_payload_hash, head_acknowledgement_inbox_id, attempt_sequence, workflow_business_key, workflow_request_hash, execution_mode, provenance, provider_idempotency_key, lifecycle_state, state_version, terminal_reason_code, external_job_ref, external_job_ref_hash, created_at, updated_at, terminal_at]
      properties:
        execution_attempt_id: { type: string, minLength: 1 }
        external_pi_implementation_project_id: { type: string, minLength: 1 }
        external_pi_validation_cycle_id: { type: string, minLength: 1 }
        external_pi_branch_id: { type: string, minLength: 1 }
        external_pi_work_order_revision_id: { type: string, minLength: 1 }
        external_pi_work_order_revision_hash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        external_pi_revision_sequence: { type: integer, format: int32, minimum: 1, maximum: 2147483647 }
        run_id: { type: string, minLength: 1 }
        run_manifest_hash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        run_cell_id: { type: string, minLength: 1 }
        cell_key: { type: string, minLength: 1 }
        training_task_spec_id: { type: string, minLength: 1 }
        training_task_spec_hash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        provider_payload_id: { type: string, minLength: 1 }
        provider_payload_hash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        head_acknowledgement_inbox_id: { type: string, minLength: 1 }
        attempt_sequence: { type: integer, format: int32, minimum: 1, maximum: 2147483647 }
        workflow_business_key: { type: string, minLength: 1 }
        workflow_request_hash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        execution_mode: { const: simulation }
        provenance: { const: non_production_fake_provider }
        provider_idempotency_key: { type: string, minLength: 1 }
        lifecycle_state:
          type: string
          enum: [prepared, submitted, running, succeeded, failed, cancelled]
        state_version: { type: integer, format: int32, minimum: 0, maximum: 2147483647 }
        terminal_reason_code:
          type: [string, 'null']
          enum: [simulation_succeeded, simulation_failed, operator_cancelled, provider_response_invalid, null]
        external_job_ref:
          oneOf:
            - $ref: '#/components/schemas/ExperimentFoundationSimulationExternalJobRefV2'
