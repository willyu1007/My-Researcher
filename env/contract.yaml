version: 1
variables:
  APP_ENV:
    type: enum
    enum: [dev, staging, prod]
    required: true
    default: dev
    description: Deployment environment profile.
  SERVICE_NAME:
    type: string
    required: true
    default: your-service
    description: Service name (logical).
  PORT:
    type: int
    required: true
    default: 8000
    description: Service listen port.
  HOST:
    type: string
    required: false
    default: 0.0.0.0
    description: Service listen host.
  DATABASE_URL:
    type: url
    required: true
    secret: true
    secret_ref: database_url
    scopes: [dev]
    description: Prisma database URL for the local development database.
  OPENAI_API_KEY:
    type: string
    required: false
    secret: true
    secret_ref: openai_api_key
    scopes: [dev]
    description: Local OpenAI API key for backend LLM workflows and topic-selection dry runs.
  DASHSCOPE_API_KEY:
    type: string
    required: false
    secret: true
    secret_ref: dashscope_api_key
    scopes: [dev]
    description: Local DashScope API key for backend LLM workflows.
  DASHSCOPE_API_KEY_CODING:
    type: string
    required: false
    secret: true
    secret_ref: dashscope_api_key_coding
    scopes: [dev]
    description: Local DashScope API key reserved for coding-oriented LLM workflows.
  DASHSCOPE_BASE_URL:
    type: url
    required: false
    default: https://dashscope.aliyuncs.com/compatible-mode/v1
    scopes: [dev]
    description: OpenAI-compatible DashScope base URL used by backend LLM workflows; may be overridden in .env.local for local provider experiments.
  DEEPSEEK_API_KEY:
    type: string
    required: false
    secret: true
    secret_ref: deepseek_api_key
    scopes: [dev]
    description: Local DeepSeek API key for future backend LLM provider integrations.
  TITLE_CARD_REPOSITORY:
    type: enum
    enum: [memory, prisma]
    required: false
    default: memory
    description: Repository strategy for title-card management and topic-selection authority stores.
  RESEARCH_LIFECYCLE_REPOSITORY:
    type: enum
    enum: [memory, prisma]
    required: false
    default: memory
    description: Repository strategy for research lifecycle stores; cascades from TITLE_CARD_REPOSITORY when unset.
  AUTO_PULL_REPOSITORY:
    type: enum
    enum: [memory, prisma]
    required: false
    default: memory
    description: Repository strategy for auto-pull stores; must match TITLE_CARD_REPOSITORY when title-card uses Prisma.
  APPLICATION_SETTINGS_REPOSITORY:
    type: enum
    enum: [memory, prisma]
    required: false
    default: memory
    description: Repository strategy for application settings; must match TITLE_CARD_REPOSITORY when title-card uses Prisma.
  AUTO_PULL_SCHEDULER_ENABLED:
    type: enum
    enum: ['true', 'false']
    required: false
    default: 'true'
    description: Enable the auto-pull background scheduler.
  LITERATURE_USER_AUTH_PIPELINE_ENABLED:
    type: enum
    enum: ['true', 'false']
    required: false
    default: 'false'
    description: Enable deep pipeline stages for USER_AUTH literature rights class.
  PAPER_ENGINEER_LOCAL_DATA_ROOT:
    type: string
    required: false
    default: /Volumes/DataDisk/Data/PaperEngineer
    scopes: [dev]
    description: Local root directory for Paper Engineer runtime data and generated artifacts.
  EXPERIMENT_FOUNDATION_LOCAL_EXECUTION_ROOT:
    type: string
    required: false
    default: .ai/.tmp/experiment-foundation-local-execution
    scopes: [dev]
    description: LocalScript execution root for experiment-foundation smoke runs; all working directories and outputs must stay inside this root.
  EXPERIMENT_FOUNDATION_LOCAL_EXECUTION_ENABLED:
    type: enum
    enum: ['true', 'false']
    required: false
    default: 'false'
    scopes: [dev]
    description: Explicit opt-in switch for experiment-foundation LocalScript execution outside NODE_ENV=test.
  EXPERIMENT_FOUNDATION_LOCAL_SCRIPT_ALLOWED_COMMANDS:
    type: string
    required: false
    default: ''
    scopes: [dev]
    description: Comma-separated LocalScript command allowlist; keep narrow for local smoke execution.
  LITERATURE_CONTENT_PROCESSING_ROOT:
    type: string
    required: false
    default: /Volumes/DataDisk/Data/PaperEngineer/literature-content-processing
    scopes: [dev]
    description: Local root directory for literature raw files, normalized text, pipeline artifacts, indexes, and exports.
  LITERATURE_KEY_CONTENT_READY_METHOD:
    type: enum
    enum: [llm_gateway, codex_curated, manual_curated]
    required: false
    default: codex_curated
    description: Default KEY_CONTENT_READY completion mode; codex_curated blocks for curated dossier import instead of calling the LLM gateway.
  UNPAYWALL_EMAIL:
    type: string
    required: false
    scopes: [dev]
    description: Contact email used for Unpaywall API requests during local literature fulltext acquisition.
  OPENALEX_MAILTO:
    type: string
    required: false
    scopes: [dev]
    description: Contact email attached to OpenAlex literature discovery requests for polite-pool identification.
  OPENALEX_API_KEY:
    type: string
    required: false
    secret: true
    secret_ref: openalex_api_key
    scopes: [dev]
    description: Optional OpenAlex API key for high-volume literature candidate discovery.
  SEMANTIC_SCHOLAR_API_KEY:
    type: string
    required: false
    secret: true
    secret_ref: semantic_scholar_api_key
    scopes: [dev]
    description: Optional Semantic Scholar Graph API key for literature candidate discovery.
  LITERATURE_PIPELINE_EMBEDDING_URL:
    type: string
    required: false
    description: Optional external embedding endpoint; unset means local fallback embedding.
  LITERATURE_PIPELINE_EMBEDDING_API_KEY:
    type: string
    required: false
    description: Optional API key for external embedding endpoint.
  LITERATURE_PIPELINE_EMBEDDING_MODEL:
    type: string
    required: false
    default: text-embedding-v1
    description: Embedding model name used when external embedding endpoint is configured.
