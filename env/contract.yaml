version: 1
variables:
  APP_ENV:
    type: enum
    enum: [dev, staging, prod]
    required: true
    default: dev
    description: Deployment environment profile.
  SERVICE_NAME:
    type: string
    required: true
    default: your-service
    description: Service name (logical).
  PORT:
    type: int
    required: true
    default: 8000
    description: Service listen port.
  HOST:
    type: string
    required: false
    default: 0.0.0.0
    description: Service listen host.
  DATABASE_URL:
    type: url
    required: true
    secret: true
    secret_ref: database_url
    scopes: [dev]
    description: Prisma database URL for the local development database.
  OPENAI_API_KEY:
    type: string
    required: false
    secret: true
    secret_ref: openai_api_key
    scopes: [dev]
    description: Local OpenAI API key for backend LLM workflows and topic-selection dry runs.
  DASHSCOPE_API_KEY:
    type: string
    required: false
    secret: true
    secret_ref: dashscope_api_key
    scopes: [dev]
    description: Local DashScope API key for backend LLM workflows.
  DASHSCOPE_API_KEY_CODING:
    type: string
    required: false
    secret: true
    secret_ref: dashscope_api_key_coding
    scopes: [dev]
    description: Local DashScope API key reserved for coding-oriented LLM workflows.
  DASHSCOPE_BASE_URL:
    type: url
    required: false
    default: https://dashscope.aliyuncs.com/compatible-mode/v1
    scopes: [dev]
    description: OpenAI-compatible DashScope base URL used by backend LLM workflows; may be overridden in .env.local for local provider experiments.
  DEEPSEEK_API_KEY:
    type: string
    required: false
    secret: true
    secret_ref: deepseek_api_key
    scopes: [dev]
    description: Local DeepSeek API key for future backend LLM provider integrations.
  TITLE_CARD_REPOSITORY:
    type: enum
    enum: [memory, prisma]
    required: false
    default: memory
    description: Repository strategy for title-card management and topic-selection authority stores.
  RESEARCH_LIFECYCLE_REPOSITORY:
    type: enum
    enum: [memory, prisma]
    required: false
    default: memory
    description: Repository strategy for research lifecycle stores; cascades from TITLE_CARD_REPOSITORY when unset.
  AUTO_PULL_REPOSITORY:
    type: enum
    enum: [memory, prisma]
    required: false
    default: memory
    description: Repository strategy for auto-pull stores; must match TITLE_CARD_REPOSITORY when title-card uses Prisma.
  APPLICATION_SETTINGS_REPOSITORY:
    type: enum
    enum: [memory, prisma]
    required: false
    default: memory
    description: Repository strategy for application settings; must match TITLE_CARD_REPOSITORY when title-card uses Prisma.
  AUTO_PULL_SCHEDULER_ENABLED:
    type: enum
    enum: ['true', 'false']
    required: false
    default: 'true'
    description: Enable the auto-pull background scheduler.
  LITERATURE_USER_AUTH_PIPELINE_ENABLED:
    type: enum
    enum: ['true', 'false']
    required: false
    default: 'false'
    description: Enable deep pipeline stages for USER_AUTH literature rights class.
  PAPER_ENGINEER_LOCAL_DATA_ROOT:
    type: string
    required: false
    default: /Volumes/DataDisk/Data/PaperEngineer
    scopes: [dev]
    description: Local root directory for Paper Engineer runtime data and generated artifacts. Code default is /Volumes/DataDisk/Data/PaperEngineer when that volume exists (macOS dev machine); otherwise $XDG_DATA_HOME/paper-engineer or ~/.local/share/paper-engineer.
  EXPERIMENT_FOUNDATION_LOCAL_EXECUTION_ROOT:
    type: string
    required: false
    default: .ai/.tmp/experiment-foundation-local-execution
    scopes: [dev]
    description: LocalScript execution root for experiment-foundation smoke runs; all working directories and outputs must stay inside this root.
  EXPERIMENT_FOUNDATION_LOCAL_EXECUTION_ENABLED:
    type: enum
    enum: ['true', 'false']
    required: false
    default: 'false'
    scopes: [dev]
    description: Explicit opt-in switch for experiment-foundation LocalScript execution outside NODE_ENV=test.
  EXPERIMENT_FOUNDATION_LOCAL_SCRIPT_ALLOWED_COMMANDS:
    type: string
    required: false
    default: ''
    scopes: [dev]
    description: Comma-separated LocalScript command allowlist; keep narrow for local smoke execution.
  PAPER_IMPLEMENTATION_EXPERIMENT_V2_ADMISSION_ENABLED:
    type: bool
    required: false
    default: false
    description: Enable only new PaperImplementation experiment v2 admissions; this switch does not gate replay or draining of already committed PI/EF integration events.
  PAPER_IMPLEMENTATION_EXPERIMENT_V2_CYCLE_CLOSURE_ENABLED:
    type: bool
    required: false
    default: false
    description: Enable only the dedicated PaperImplementation v2 ValidationCycle closure lane (the sole first-release live path is the no-evidence closure); this switch does not gate readback, replay or draining of committed events and requires the committed cutover.
  EXPERIMENT_FOUNDATION_V2_WORKFLOW_SIMULATION_ENABLED:
    type: bool
    required: false
    default: false
    description: Enable only new non-production ExperimentFoundation v2 workflow simulations; this switch does not stop draining, reconciling, cancelling, or collecting already committed simulation commands.
  EXPERIMENT_FOUNDATION_V2_REAL_PROVIDER_INTAKE_ENABLED:
    type: bool
    required: false
    default: false
    description: Enable only new ExperimentFoundation v2 real-provider Attempts after committed cutover; disabling intake never stops draining already committed provider commands.
  EXPERIMENT_FOUNDATION_V2_REAL_PROVIDER_CONTROL_DRAIN_ENABLED:
    type: bool
    required: false
    default: false
    description: Enable the separately composed real-provider command drain; this must remain enabled until every committed real-provider submit, sync, reconcile, cancel and collect command is terminal.
  EXPERIMENT_FOUNDATION_V2_SCIENTIFIC_VALIDATION_ENABLED:
    type: bool
    required: false
    default: false
    description: Enable only new ExperimentFoundation v2 scientific result recording and validation intake; this switch does not stop relay draining or replay of already committed integration events and requires the committed cutover.
  EXPERIMENT_FOUNDATION_V2_PROMOTION_ENABLED:
    type: bool
    required: false
    default: false
    description: Enable only the server-owned ExperimentFoundation v2 typed candidate promotion/canonicalization command; this switch does not reopen legacy promotion and requires the committed v2 cutover.
  EXPERIMENT_FOUNDATION_V2_ALIYUN_CLOUD_PREFLIGHT_ENABLED:
    type: bool
    required: false
    default: false
    scopes: [dev]
    description: Enable only the zero-write Aliyun PAI read-only preflight; this switch never authorizes CreateJob or scientific execution.
  EXPERIMENT_FOUNDATION_V2_ALIYUN_PREFLIGHT_REGION_ID:
    type: string
    required: false
    scopes: [dev]
    description: Exact Aliyun region ID for the zero-write PAI cloud preflight.
  EXPERIMENT_FOUNDATION_V2_ALIYUN_PREFLIGHT_WORKSPACE_ID:
    type: string
    required: false
    scopes: [dev]
    description: Exact PAI workspace ID inspected by the zero-write cloud preflight.
  EXPERIMENT_FOUNDATION_V2_ALIYUN_PREFLIGHT_RESOURCE_MODE:
    type: string
    required: false
    default: exact_quota
    scopes: [dev]
    description: Explicit Aliyun resource selector mode for the zero-write preflight; allowed values are exact_quota and public_resource.
  EXPERIMENT_FOUNDATION_V2_ALIYUN_PREFLIGHT_RESOURCE_ID:
    type: string
    required: false
    scopes: [dev]
    description: Exact DLC resource quota ID required only for exact_quota mode; it must be absent in public_resource mode.
  EXPERIMENT_FOUNDATION_V2_ALIYUN_PREFLIGHT_IMAGE_URI:
    type: string
    required: false
    scopes: [dev]
    description: Exact runtime image reference used only for offline CreateJob request materialization.
  EXPERIMENT_FOUNDATION_V2_ALIYUN_PREFLIGHT_IDENTITY_POLICY_EVIDENCE_PATH:
    type: string
    required: false
    scopes: [dev]
    description: Repo-external JSON evidence binding the temporary preflight credential to the reviewed read-only RAM policy with explicit paidlc:CreateJob denial.
  EXPERIMENT_FOUNDATION_V2_ALIYUN_PREFLIGHT_IDENTITY_POLICY_EVIDENCE_SHA256:
    type: string
    required: false
    scopes: [dev]
    description: Independently supplied sha256:<lowercase-hex> digest of the exact repo-external reviewed identity-policy evidence file.
  ALIBABA_CLOUD_ACCESS_KEY_ID:
    type: string
    required: false
    secret: true
    secret_ref: alibaba_cloud_access_key_id
    scopes: [dev]
    description: Temporary STS AccessKey ID for the dedicated Aliyun read-only preflight identity; long-lived account credentials are not accepted by the gate.
  ALIBABA_CLOUD_ACCESS_KEY_SECRET:
    type: string
    required: false
    secret: true
    secret_ref: alibaba_cloud_access_key_secret
    scopes: [dev]
    description: Temporary STS AccessKey secret for the dedicated Aliyun read-only preflight identity.
  ALIBABA_CLOUD_SECURITY_TOKEN:
    type: string
    required: false
    secret: true
    secret_ref: alibaba_cloud_security_token
    scopes: [dev]
    description: Temporary STS security token required by the dedicated Aliyun read-only preflight identity.
  PAPER_IMPLEMENTATION_EXPERIMENT_V2_CUTOVER_COMMITTED:
    type: bool
    required: false
    default: false
    description: Commit the single-writer v2 product boundary by rejecting legacy PI WorkOrder/Harness/live and EF generic/readiness/promotion/execution mutations while preserving diagnostics reads and integration-event draining.
  LITERATURE_CONTENT_PROCESSING_ROOT:
    type: string
    required: false
    default: /Volumes/DataDisk/Data/PaperEngineer/literature-content-processing
    scopes: [dev]
    description: Local root directory for literature raw files, normalized text, pipeline artifacts, indexes, and exports. Defaults to <PAPER_ENGINEER_LOCAL_DATA_ROOT>/literature-content-processing (portable fallback applies when the macOS dev volume is absent).
  LITERATURE_KEY_CONTENT_READY_METHOD:
    type: enum
    enum: [llm_gateway, codex_curated, manual_curated]
    required: false
    default: codex_curated
    description: Default KEY_CONTENT_READY completion mode; codex_curated blocks for curated dossier import instead of calling the LLM gateway.
  UNPAYWALL_EMAIL:
    type: string
    required: false
    scopes: [dev]
    description: Contact email used for Unpaywall API requests during local literature fulltext acquisition.
  OPENALEX_MAILTO:
    type: string
    required: false
    scopes: [dev]
    description: Contact email attached to OpenAlex literature discovery requests for polite-pool identification.
  OPENALEX_API_KEY:
    type: string
    required: false
    secret: true
    secret_ref: openalex_api_key
    scopes: [dev]
    description: Optional OpenAlex API key for high-volume literature candidate discovery.
  SEMANTIC_SCHOLAR_API_KEY:
    type: string
    required: false
    secret: true
    secret_ref: semantic_scholar_api_key
    scopes: [dev]
    description: Optional Semantic Scholar Graph API key for literature candidate discovery.
  LITERATURE_PIPELINE_EMBEDDING_URL:
    type: string
    required: false
    description: Optional external embedding endpoint; unset means local fallback embedding.
  LITERATURE_PIPELINE_EMBEDDING_API_KEY:
    type: string
    required: false
    description: Optional API key for external embedding endpoint.
  LITERATURE_PIPELINE_EMBEDDING_MODEL:
    type: string
    required: false
    default: text-embedding-v1
    description: Embedding model name used when external embedding endpoint is configured.
